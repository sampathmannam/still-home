name: Build and permission check
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK components
        run: sdkmanager 'platforms;android-36' 'build-tools;36.1.0'
      - name: Build with a disposable verification key
        run: python3 build.py --build-dir build --signing-dir "$RUNNER_TEMP/still-home-ci-signing" --output dist/StillHome.apk
      - name: Check the packaged permission boundary
        run: |
          "$ANDROID_SDK_ROOT/build-tools/36.1.0/aapt2" dump permissions dist/StillHome.apk > build/permissions.txt
          python3 - <<'PYCODE'
          from pathlib import Path
          permissions = [line.strip() for line in Path('build/permissions.txt').read_text().splitlines() if line.startswith('uses-permission:')]
          assert permissions == ["uses-permission: name='android.permission.ACCESS_NETWORK_STATE'"], permissions
          PYCODE
      - name: Remove disposable signing material
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/still-home-ci-signing"
